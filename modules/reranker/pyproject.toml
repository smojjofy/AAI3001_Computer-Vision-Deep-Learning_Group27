[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-splat-reranker"
version = "0.1.0"
description = "One-reference frame reranker for the Group 27 live splat MVP"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
