[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-splat-optical-flow"
version = "0.1.0"
description = "Forward camera-frame optical flow for the Group 27 live splat MVP"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10,<5"]

[project.optional-dependencies]
raft = ["torch", "torchvision"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
