[pytest]
# Keep collection on real test suites. Script folders contain diagnostic
# entry points named test_*.py that need optional SDKs (mediapipe, ultralytics).
testpaths =
    tests
    modules/inference/tests
    modules/inference/depth/tests
    modules/inference/segmentation/tests
    modules/splat_constructor/tests
    modules/reconstruction_validation
norecursedirs =
    .git
    build
    .tmp
    outputs
    data
    checkpoints
pythonpath = .
