<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gsplat 1.2.9 spike</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c101a;
      }

      #viewer {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: absolute;
        bottom: 10px;
        left: 12px;
        padding: 8px 11px;
        border: 1px solid rgba(120, 170, 255, 0.35);
        border-radius: 6px;
        background: rgba(8, 12, 20, 0.78);
        color: #cfe3ff;
        font: 12px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }

      #hud.error {
        border-color: rgba(255, 96, 96, 0.7);
        color: #ff9a9a;
      }
    </style>
  </head>
  <body>
    <canvas id="viewer"></canvas>
    <div id="hud">gsplat spike: loading module...</div>
    <script type="module" src="/src/spike-gsplat.ts"></script>
  </body>
</html>
